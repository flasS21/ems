spring.application.name=ems
spring.config.import=optional:file:.env[.properties]

# API Base Path & Versioning
server.servlet.context-path=/api/v1

# Security Auto-Configuration Exclusion (Disabled initially, will enable later)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Datasource Configuration (reads from env / .env)
spring.datasource.url=jdbc:postgresql://localhost:5433/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6380
spring.data.redis.password=${REDIS_PASSWORD}

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true

# Flyway Migration Configuration
spring.flyway.enabled=true

# Actuator Endpoints Exposure
management.endpoints.web.exposure.include=health,info
