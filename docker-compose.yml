services:

  postgres:
    image: postgres:17
    container_name: ems-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ems-net
    deploy:
      resources:
        limits:
          memory: 512m

  redis:
    image: redis:7
    container_name: ems-redis
    # --requirepass: password auth | --appendonly yes: AOF persistence (survives container restarts)
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ems-net
    deploy:
      resources:
        limits:
          memory: 256m

volumes:
  pgdata:    # Postgres data survives container restarts & removals
  redisdata: # Redis AOF log files

networks:
  ems-net:
    driver: bridge
